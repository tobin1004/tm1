
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Rock Scissors Paper Game</title>

    <style>

        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }

        h2 {
            color: #333;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #2878d0;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background-color: gray;
            cursor: not-allowed;
        }

        #webcam-container {
            margin: 15px;
        }

        #countdown {
            font-size: 45px;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px;
        }

        #result {
            font-size: 24px;
            font-weight: bold;
            color: #2878d0;
            margin: 20px;
        }

        #score {
            font-size: 22px;
            margin: 20px;
        }

        #label-container {
            font-size: 17px;
            line-height: 1.8;
            margin: 15px;
        }

        #status {
            color: #555;
            margin: 15px;
        }

    </style>

</head>

<body>

    <h2>AI 가위바위보 게임</h2>

    <button id="startBtn" onclick="startGame()">
        게임 시작
    </button>

    <button onclick="resetGame()">
        점수 초기화
    </button>

    <h3>나의 손동작</h3>

    <div id="webcam-container"></div>

    <div id="label-container">
        웹캠 실행 전
    </div>

    <div id="countdown"></div>

    <h3>게임 결과</h3>

    <div id="result">
        게임을 시작하세요!
    </div>

    <h3>점수 (3판 2선승제)</h3>

    <div id="score">
        나: 0점 / 컴퓨터: 0점
    </div>

    <div id="status">
        게임 준비 완료
    </div>


    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>


    <script>

        // 1. Teachable Machine 모델 경로

        const URL = "./model/";

        let model;
        let webcam;

        let isReady = false;
        let isPlaying = false;
        let gameOver = false;

        let myScore = 0;
        let computerScore = 0;

        // 클래스 이름
        const hands = ["Scissors", "Rock", "Paper"];

        const startBtn =
            document.getElementById("startBtn");


        // 시간 지연 함수

        function sleep(ms) {

            return new Promise(resolve => setTimeout(resolve, ms));

        }


        // 2. 게임 시작 및 모델 로딩

        async function startGame() {

            if (isPlaying) return;

            if (gameOver) {
                resetGame();
            }

            startBtn.disabled = true;

            try {

                // 모델 최초 실행 시에만 로딩

                if (!isReady) {

                    document.getElementById("status").innerHTML =
                        "AI 모델을 불러오는 중입니다.";

                    const modelURL =
                        URL + "model.json";

                    const metadataURL =
                        URL + "metadata.json";

                    model = await tmImage.load(
                        modelURL,
                        metadataURL
                    );

                    // 클래스 이름 확인

                    console.log(
                        "모델 클래스:",
                        model.getClassLabels()
                    );

                    // 웹캠 설정

                    webcam = new tmImage.Webcam(
                        300, 300, true
                    );

                    await webcam.setup();

                    await webcam.play();

                    document.getElementById("webcam-container")
                        .appendChild(webcam.canvas);

                    isReady = true;

                }

                // 한 판 진행

                await playRound();

            }

            catch (error) {

                console.error(error);

                document.getElementById("status").innerHTML =
                    "오류 발생: 모델 경로와 카메라 권한을 확인하세요.";

                startBtn.disabled = false;

            }

        }


        // 3. 한 판 진행

        async function playRound() {

            isPlaying = true;

            document.getElementById("status").innerHTML =
                "손동작을 준비하세요!";

            document.getElementById("result").innerHTML =
                "가위, 바위, 보 중 하나를 준비하세요.";

            // 3초 카운트다운

            for (let i = 3; i >= 1; i--) {

                document.getElementById("countdown").innerHTML =
                    i;

                await sleep(1000);

            }

            document.getElementById("countdown").innerHTML =
                "인식 중!";

            document.getElementById("status").innerHTML =
                "AI가 손동작을 분석하고 있습니다.";

            // 손동작 인식

            const myHand = await recognizeHand();

            if (myHand === null) {

                document.getElementById("result").innerHTML =
                    "손동작을 인식하지 못했습니다.";

                document.getElementById("status").innerHTML =
                    "다시 게임 시작 버튼을 눌러주세요.";

                document.getElementById("countdown").innerHTML =
                    "";

                isPlaying = false;

                startBtn.disabled = false;

                startBtn.innerHTML = "다시 시도";

                return;

            }


            // 컴퓨터가 무작위로 선택

            const computerHand =
                hands[Math.floor(Math.random() * 3)];


            // 승패 판정

            let result = "";

            if (myHand === computerHand) {

                result = "무승부!";

            }

            else if (

                (myHand === "Scissors" &&
                 computerHand === "Paper") ||

                (myHand === "Rock" &&
                 computerHand === "Scissors") ||

                (myHand === "Paper" &&
                 computerHand === "Rock")

            ) {

                result = "승리!";

                myScore++;

            }

            else {

                result = "패배!";

                computerScore++;

            }


            // 게임 결과 출력

            document.getElementById("result").innerHTML =

                "나: " + myHand +

                "<br>컴퓨터: " + computerHand +

                "<br><br>" + result;


            // 점수 출력

            document.getElementById("score").innerHTML =

                "나: " + myScore +

                "점 / 컴퓨터: " + computerScore + "점";


            document.getElementById("countdown").innerHTML = "";


            // 3판 2선승제

            if (myScore >= 2 || computerScore >= 2) {

                gameOver = true;

                if (myScore >= 2) {

                    document.getElementById("result").innerHTML +=
                        "<br><br>축하합니다! 최종 승리!";

                }

                else {

                    document.getElementById("result").innerHTML +=
                        "<br><br>컴퓨터 최종 승리!";

                }

                document.getElementById("status").innerHTML =
                    "게임 종료! 다시 시작할 수 있습니다.";

                startBtn.innerHTML = "다시 시작";

            }

            else {

                document.getElementById("status").innerHTML =
                    "다음 판을 진행하려면 버튼을 누르세요.";

                startBtn.innerHTML = "다음 판";

            }


            isPlaying = false;

            startBtn.disabled = false;

        }


        // 4. 손동작 인식 함수

        async function recognizeHand() {

            const total = {};

            const labels = model.getClassLabels();

            // 클래스별 확률 초기화

            for (const name of labels) {

                total[name] = 0;

            }


            // 12회 예측

            for (let i = 0; i < 12; i++) {

                webcam.update();

                const prediction =
                    await model.predict(webcam.canvas);

                for (let j = 0; j < prediction.length; j++) {

                    const name =
                        prediction[j].className;

                    const probability =
                        prediction[j].probability;

                    total[name] += probability;

                }

                await sleep(150);

            }


            // 평균 확률 계산

            let bestName = "";

            let bestProbability = -1;

            let secondProbability = -1;

            for (const name of labels) {

                const avg = total[name] / 12;

                if (avg > bestProbability) {

                    secondProbability = bestProbability;

                    bestProbability = avg;

                    bestName = name;

                }

                else if (avg > secondProbability) {

                    secondProbability = avg;

                }

            }


            // 실제 인식 결과 표시

            document.getElementById("label-container").innerHTML =

                "인식 클래스: " + labels.join(", ") +

                "<br>최종 인식: " + bestName +

                "<br>평균 확률: " +
                (bestProbability * 100).toFixed(1) + "%";


            // 클래스명 변환

            const result = normalizeHand(bestName);


            // 인식 결과 확인

            if (result === null) {

                document.getElementById("status").innerHTML =
                    "클래스 이름을 확인하세요.";

                return null;

            }


            // 확률이 너무 낮으면 재시도

            if (bestProbability < 0.40) {

                document.getElementById("status").innerHTML =
                    "인식 정확도가 낮습니다. 다시 시도하세요.";

                return null;

            }

            return result;

        }


        // 5. 클래스 이름 변환

        function normalizeHand(name) {

            const n = name.toLowerCase().trim();

            if (n === "scissors") {
                return "Scissors";
            }

            if (n === "rock") {
                return "Rock";
            }

            if (n === "paper") {
                return "Paper";
            }

            return null;

        }


        // 6. 점수 초기화

        function resetGame() {

            myScore = 0;

            computerScore = 0;

            gameOver = false;

            isPlaying = false;

            document.getElementById("score").innerHTML =
                "나: 0점 / 컴퓨터: 0점";

            document.getElementById("result").innerHTML =
                "게임을 시작하세요!";

            document.getElementById("countdown").innerHTML =
                "";

            document.getElementById("label-container").innerHTML =
                "손동작을 준비하세요.";

            document.getElementById("status").innerHTML =
                "게임 준비 완료!";

            startBtn.innerHTML = "게임 시작";

            startBtn.disabled = false;

        }

    </script>

</body>

</html>
