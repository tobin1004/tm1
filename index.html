
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Rock Scissors Paper</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #2878d0;
            color: white;
        }

        #webcam-container {
            margin: 20px auto;
        }

        #label-container {
            margin: 15px;
        }

        .game-box {
            background-color: white;
            width: 320px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        .result {
            font-size: 24px;
            font-weight: bold;
            color: #e44d26;
            margin: 20px;
        }

        .score {
            font-size: 22px;
            color: #2878d0;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Rock Scissors Paper Game</h1>
    <h3>Play against the Computer! (Best of 3)</h3>

    <button type="button" onclick="init()">Start Game</button>
    <button type="button" onclick="resetGame()">Restart</button>

    <div id="webcam-container"></div>

    <div id="label-container"></div>

    <div class="game-box">

        <h2>Game Status</h2>

        <p>My Choice: <span id="my-choice">-</span></p>

        <p>Computer Choice: <span id="computer-choice">-</span></p>

        <div class="result" id="round-result">
            Start the game!
        </div>

        <div class="score">
            Me <span id="my-score">0</span> :
            <span id="computer-score">0</span> Computer
        </div>

        <h3 id="game-result">First to 2 wins!</h3>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>

        // Teachable Machine model path
        const URL = "./model/";

        let model, webcam;
        let labelContainer, maxPredictions;

        // Score and game status
        let myScore = 0;
        let computerScore = 0;

        let gameStarted = false;
        let gameFinished = false;

        // Prevent duplicate judgments
        let lastChoice = "";
        let choiceCount = 0;

        // Rock Scissors Paper
        const choices = ["Scissors", "Rock", "Paper"];

        // Start game
        async function init() {

            if (gameStarted) return;

            gameStarted = true;

            document.getElementById("game-result").innerHTML =
                "Show your hand to the camera!";

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Load model
            model = await tmImage.load(modelURL, metadataURL);

            maxPredictions = model.getTotalClasses();

            // Setup webcam
            const flip = true;

            webcam = new tmImage.Webcam(200, 200, flip);

            await webcam.setup();
            await webcam.play();

            window.requestAnimationFrame(loop);

            // Display webcam
            document.getElementById("webcam-container")
                .appendChild(webcam.canvas);

            labelContainer =
                document.getElementById("label-container");

            for (let i = 0; i < maxPredictions; i++) {

                labelContainer.appendChild(
                    document.createElement("div")
                );

            }
        }

        // Webcam loop
        async function loop() {

            if (!gameStarted) return;

            webcam.update();

            await predict();

            window.requestAnimationFrame(loop);
        }

        // Predict hand gesture
        async function predict() {

            if (gameFinished) return;

            const prediction = await model.predict(webcam.canvas);

            let bestPrediction = prediction[0];

            for (let i = 0; i < maxPredictions; i++) {

                const classPrediction =
                    prediction[i].className + ": " +
                    prediction[i].probability.toFixed(2);

                labelContainer.childNodes[i].innerHTML =
                    classPrediction;

                if (prediction[i].probability >
                    bestPrediction.probability) {

                    bestPrediction = prediction[i];
                }
            }

            const myChoice = bestPrediction.className;

            // Recognition confidence must be at least 90%
            if (bestPrediction.probability < 0.90) {

                lastChoice = "";
                choiceCount = 0;
                return;
            }

            // Check class name
            if (!choices.includes(myChoice)) return;

            // Check whether the same gesture continues
            if (myChoice === lastChoice) {

                choiceCount++;

            } else {

                lastChoice = myChoice;
                choiceCount = 0;
            }

            // Play one round after continuous recognition
            if (choiceCount >= 30) {

                playGame(myChoice);

                lastChoice = "";
                choiceCount = 0;
            }
        }

        // Rock Scissors Paper game
        function playGame(myChoice) {

            if (gameFinished) return;

            // Computer randomly selects a gesture
            const computerChoice =
                choices[Math.floor(Math.random() * 3)];

            document.getElementById("my-choice").innerHTML =
                myChoice;

            document.getElementById("computer-choice").innerHTML =
                computerChoice;

            let result = "";

            // Determine winner
            if (myChoice === computerChoice) {

                result = "Draw!";

            } else if (

                (myChoice === "Rock" &&
                 computerChoice === "Scissors") ||

                (myChoice === "Scissors" &&
                 computerChoice === "Paper") ||

                (myChoice === "Paper" &&
                 computerChoice === "Rock")

            ) {

                result = "You Win! 🎉";
                myScore++;

            } else {

                result = "You Lose!";
                computerScore++;
            }

            document.getElementById("round-result").innerHTML =
                result;

            // Display scores
            document.getElementById("my-score").innerHTML =
                myScore;

            document.getElementById("computer-score").innerHTML =
                computerScore;

            // Check final result
            if (myScore === 2) {

                gameFinished = true;

                document.getElementById("game-result").innerHTML =
                    "🏆 Congratulations! You Win!";

            } else if (computerScore === 2) {

                gameFinished = true;

                document.getElementById("game-result").innerHTML =
                    "Computer Wins! Try Again!";

            } else {

                document.getElementById("game-result").innerHTML =
                    "Get Ready for the Next Round!";
            }
        }

        // Reset game
        function resetGame() {

            myScore = 0;
            computerScore = 0;

            gameFinished = false;

            lastChoice = "";
            choiceCount = 0;

            document.getElementById("my-choice").innerHTML = "-";

            document.getElementById("computer-choice").innerHTML = "-";

            document.getElementById("my-score").innerHTML = "0";

            document.getElementById("computer-score").innerHTML = "0";

            document.getElementById("round-result").innerHTML =
                "Start a new game!";

            document.getElementById("game-result").innerHTML =
                "First to 2 wins!";
        }

    </script>

</body>
</html>
